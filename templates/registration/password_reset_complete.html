{% extends 'base.html' %}

{% block title %}Password Reset Complete - BotanIQ{% endblock %}

{% block content %}
<div class="container fade-in" style="max-width: 500px; margin: 4rem auto;">
    <div class="card">
        <div class="card-content" style="text-align: center; padding: 3rem;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
            <h1 style="font-family: var(--font-heading); color: var(--primary-green); margin-bottom: 1rem;">
                Password Reset Complete
            </h1>
            <p style="color: var(--text-medium); margin-bottom: 2rem;">
                Your password has been set successfully. You can now sign in with your new password.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; font-size: 1.1rem;">
                Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
